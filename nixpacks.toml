[phases.setup]
nixPkgs = ['php83', 'php83Extensions.pdo', 'php83Extensions.pdo_sqlite', 'php83Extensions.mbstring', 'php83Extensions.xml', 'php83Extensions.curl', 'php83Extensions.tokenizer', 'php83Extensions.dom', 'php83Extensions.fileinfo', 'php83Extensions.ctype', 'nodejs_20']

[phases.install]
cmds = ['composer update --no-dev --optimize-autoloader --no-interaction', 'cp .env.example .env', 'npm install', 'npm run build']

[variables]
APP_KEY = "base64:w6tw/F3clxp0gcuxJoTvvcXA6/ZcDIk8vaISdhrBZX4="
APP_ENV = "production"
APP_DEBUG = "false"
DB_CONNECTION = "sqlite"

[start]
cmd = 'cp .env.example .env && rm -f /app/database/database.sqlite && touch /app/database/database.sqlite && php artisan migrate --force --seed && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
